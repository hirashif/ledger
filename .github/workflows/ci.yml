name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # testcontainers starts its own postgres, the runner just needs docker,
      # which ubuntu-latest already has
      - run: mvn -B test

      - run: mvn -B -DskipTests package
